# Default values for donweather-ms-weather
replicaCount: 2

image:
  repository: buildbyte-container-registry.registry.twcstorage.ru/donweather-ms-weather
  pullPolicy: IfNotPresent
  tag: "dev"
  digest: "sha256:c74fed06074160f84baddd5423b88f1047f86d952a60161937e7e4b4946ba5c2"

imagePullSecrets:
  - name: docker-registry-credentials
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# HTTPRoute for Gateway API
httpRoute:
  enabled: true
  gatewayRef:
    name: "dev-gateway"
    namespace: ""  # Если пусто, используется namespace приложения
  hostnames: []  # Пример: ["donweather.example.com"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ""  # Если пусто, используется имя сервиса из chart
          port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables
env:
  corsOrigin: "*"
  env: "dev"

# Database connection string (will be stored in Secret)
database:
  host: "postgres"
  port: 5432
  name: "weather"
  user: "myuser"
  password: "mypassword"
  sslmode: "disable"

# Weather API Key (will be stored in Secret)
weatherApiKey: ""

# Health check configuration
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
