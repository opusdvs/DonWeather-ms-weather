# Default values for donweather-ms-weather
replicaCount: 2

image:
  repository: buildbyte-container-registry.registry.twcstorage.ru/donweather-ms-weather
  pullPolicy: IfNotPresent
  tag: "dev"
  digest: "sha256:0f8235ecfe0cc4f01743c64e53ffa820f01280936f8d868ff0b2a1447a6fe545"


imagePullSecrets:
  - name: registry-docker-registry
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# HTTPRoute (Gateway API)
httpRoute:
  enabled: true
  annotations: {}
  # parentRefs определяют к какому Gateway/Listener прикрепить маршрут.
  # По умолчанию цепляемся к dev-gateway (HTTPS listener).
  parentRefs:
    - name: dev-gateway
      namespace: default
      sectionName: https
  hostnames:
    - api.donweather.dev.buildbyte.ru
  pathPrefix: /
  # Если нужно — можно передать полный массив spec.rules (как в Gateway API).
  rules: []

  # Redirect HTTP(80) -> HTTPS(443). Важно: укажите parentRefs на HTTP listener (например sectionName: http),
  # иначе при привязке к HTTPS listener получите redirect-loop.
  redirectToHttps:
    enabled: true
    annotations: {}
    # parentRefs для HTTP listener (обычно тот же Gateway, но sectionName=http)
    parentRefs:
      - name: dev-gateway
        namespace: default
        sectionName: http
    statusCode: 301
    scheme: https
    port: 443

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables
env:
  corsOrigin: "*"
  env: "dev"

# Database connection string (will be stored in Secret)
database:
  host: "postgres"
  port: 5432
  name: "weather"
  user: "myuser"
  password: "mypassword"
  sslmode: "disable"

# Weather API Key (will be stored in Secret)
weatherApiKey: ""

# Vault Secrets Operator (HashiCorp VSO)
# Секрет создаётся оператором из одного пути Vault KV. В пути должны быть ключи:
# db-password, db-user, db-host, db-port, db-name, weather-api-key, cors-origin
vaultSecretOperator:
  enabled: true
  vaultAuthRef: "vault-auth"  # имя VaultAuth в том же namespace или namespace/name
  mount: "secret"            # mount KV engine в Vault
  path: "donweather"         # путь к секрету (все ключи из этого пути попадут в K8s Secret)
  type: "kv-v2"
  refreshAfter: "1h"
  # version: 2  # опционально, для kv-v2

# Health check configuration
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
