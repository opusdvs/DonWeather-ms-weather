# Default values for donweather-ms-weather
replicaCount: 2

image:
  repository: buildbyte-container-registry.registry.twcstorage.ru/donweather-ms-weather
  pullPolicy: IfNotPresent
  tag: "dev"
  digest: "sha256:a97ccbaec5a5889b899e04e8d32352b98b7feda68d3d4093e8c958f56cd763f7"

imagePullSecrets:
  - name: docker-registry-credentials
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# HTTPRoute for Gateway API
httpRoute:
  enabled: true
  gatewayRef:
    name: "dev-gateway"
    namespace: ""  # Если пусто, используется namespace приложения
  hostnames: []  # Пример: ["donweather.example.com"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ""  # Если пусто, используется имя сервиса из chart
          port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables
env:
  corsOrigin: "*"
  env: "dev"

# Database connection string (will be stored in Secret)
database:
  host: "postgres"
  port: 5432
  name: "weather"
  user: "myuser"
  password: "mypassword"
  sslmode: "disable"

# Weather API Key (will be stored in Secret)
weatherApiKey: ""

# ExternalSecret configuration
externalSecret:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: "vault"  # Имя ClusterSecretStore (для Vault)
    kind: "ClusterSecretStore"  # ClusterSecretStore для кластерного доступа
  target:
    creationPolicy: "Owner"  # Owner, Merge, None
  secrets:
    # Для Vault KV v2:
    #   - путь: secret/data/path/to/secret (обязателен префикс /data)
    #   - property: имя поля в JSON объекте секрета
    dbPassword:
      key: "secret/data/donweather/db-password"  # Путь к секрету в Vault (KV v2)
      property: "password"  # Имя свойства в секрете
    dbUser:
      key: "secret/data/donweather/db-user"  # Путь к секрету в Vault (KV v2)
      property: "user"
    dbHost:
      key: "secret/data/donweather/db-host"  # Путь к секрету в Vault (KV v2)
      property: "host"
    dbPort:
      key: "secret/data/donweather/db-port"  # Путь к секрету в Vault (KV v2)
      property: "port"
    dbName:
      key: "secret/data/donweather/db-name"  # Путь к секрету в Vault (KV v2)
      property: "name"
    weatherApiKey:
      key: "secret/data/donweather/weather-api-key"  # Путь к секрету в Vault (KV v2)
      property: "api-key"  # Имя свойства в секрете
    corsOrigin:
      key: "secret/data/donweather/cors-origin"  # Путь к секрету в Vault (KV v2)
      property: "origin"  # Имя свойства в секрете

# Health check configuration
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
