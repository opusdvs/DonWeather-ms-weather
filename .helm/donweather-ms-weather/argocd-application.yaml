apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: donweather-ms-weather
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/your-org/DonWeather-ms-weather.git
    targetRevision: main
    path: helm/donweather-ms-weather
    helm:
      valueFiles:
        - values.yaml
      # Переопределение значений через параметры
      parameters:
        - name: replicaCount
          value: "2"
        - name: image.repository
          value: "your-registry/donweather-ms-weather"
        - name: image.tag
          value: "latest"
        - name: database.host
          value: "postgres-service"
        - name: database.port
          value: "5432"
        - name: database.name
          value: "weather"
        - name: database.user
          value: "myuser"
        - name: database.sslmode
          value: "disable"
        - name: env.corsOrigin
          value: "*"
        - name: env.env
          value: "production"
      # Или используйте values для более сложных структур
      # values: |
      #   replicaCount: 2
      #   image:
      #     repository: your-registry/donweather-ms-weather
      #     tag: latest
  
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
