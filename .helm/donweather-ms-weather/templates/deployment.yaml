apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "donweather-ms-weather.fullname" . }}
  labels:
    {{- include "donweather-ms-weather.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "donweather-ms-weather.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if .Values.podAnnotations }}
      {{- $hasAnnotations := false }}
      {{- range $k, $v := .Values.podAnnotations }}{{- $hasAnnotations = true }}{{- end }}
      {{- if $hasAnnotations }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      {{- end }}
      {{- end }}
      labels:
        {{- include "donweather-ms-weather.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        {{- if kindIs "string" . }}
        - name: {{ . }}
        {{- else if .name }}
        - name: {{ .name }}
        {{- end }}
        {{- end }}
      {{- end }}
      serviceAccountName: default
      {{- if .Values.podSecurityContext }}
      {{- $hasSecurityContext := false }}
      {{- range $k, $v := .Values.podSecurityContext }}{{- $hasSecurityContext = true }}{{- end }}
      {{- if $hasSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- if .Values.securityContext }}
          {{- $hasSecurityContext := false }}
          {{- range $k, $v := .Values.securityContext }}{{- $hasSecurityContext = true }}{{- end }}
          {{- if $hasSecurityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if and .Values.image.digest (ne .Values.image.digest "") }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "donweather-ms-weather.fullname" . }}-secret
                  key: db-password
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "donweather-ms-weather.fullname" . }}-secret
                  key: db-user
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "donweather-ms-weather.fullname" . }}-secret
                  key: db-host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "donweather-ms-weather.fullname" . }}-secret
                  key: db-port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "donweather-ms-weather.fullname" . }}-secret
                  key: db-name
            - name: WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "donweather-ms-weather.fullname" . }}-secret
                  key: weather-api-key
            - name: CORS_ORIGIN
              valueFrom:
                {{- if .Values.vaultSecretOperator.enabled }}
                secretKeyRef:
                  name: {{ include "donweather-ms-weather.fullname" . }}-secret
                  key: cors-origin
                {{- else }}
                configMapKeyRef:
                  name: {{ include "donweather-ms-weather.fullname" . }}-config
                  key: cors-origin
                {{- end }}
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "donweather-ms-weather.fullname" . }}-config
                  key: env
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.nodeSelector }}
      {{- $hasNodeSelector := false }}
      {{- range $k, $v := .Values.nodeSelector }}{{- $hasNodeSelector = true }}{{- end }}
      {{- if $hasNodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if .Values.affinity }}
      {{- $hasAffinity := false }}
      {{- range $k, $v := .Values.affinity }}{{- $hasAffinity = true }}{{- end }}
      {{- if $hasAffinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if and .Values.tolerations (gt (len .Values.tolerations) 0) }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
