{{- $svcName := include "donweather-ms-weather.fullname" . -}}
{{- with .Values.httpRoute }}
{{- if .enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $svcName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "donweather-ms-weather.labels" $ | nindent 4 }}
  {{- with .annotations }}
  {{- if gt (len .) 0 }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  parentRefs:
    {{- range .parentRefs }}
    - name: {{ .name }}
      {{- if and .namespace (ne .namespace "") }}
      namespace: {{ .namespace }}
      {{- end }}
      {{- if and .sectionName (ne .sectionName "") }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  hostnames:
    {{- range .hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    {{- if and .rules (gt (len .rules) 0) }}
    {{- toYaml .rules | nindent 4 }}
    {{- else }}
    {{- if and .rootRedirect .rootRedirect.enabled }}
    - matches:
        - path:
            type: Exact
            value: "/"
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              value: {{ .rootRedirect.toPath | default "/health/ready" | quote }}
            statusCode: {{ .rootRedirect.statusCode | default 302 }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .pathPrefix | default "/" | quote }}
      backendRefs:
        - kind: Service
          name: {{ $svcName }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
{{- end }}

{{- with .Values.httpRoute.redirectToHttps }}
{{- if .enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-redirect-to-https" $svcName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "donweather-ms-weather.labels" $ | nindent 4 }}
  {{- with .annotations }}
  {{- if gt (len .) 0 }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  parentRefs:
    {{- range .parentRefs }}
    - name: {{ .name }}
      {{- if and .namespace (ne .namespace "") }}
      namespace: {{ .namespace }}
      {{- end }}
      {{- if and .sectionName (ne .sectionName "") }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  hostnames:
    {{- range $.Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $.Values.httpRoute.pathPrefix | default "/" | quote }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: {{ .scheme | default "https" | quote }}
            port: {{ .port | default 443 }}
            statusCode: {{ .statusCode | default 301 }}
{{- end }}
{{- end }}
