apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "donweather-ms-weather.fullname" . }}-config
  labels:
    {{- include "donweather-ms-weather.labels" . | nindent 4 }}
data:
  {{- if not .Values.externalSecret.enabled }}
  cors-origin: {{ .Values.env.corsOrigin | quote }}
  {{- end }}
  env: {{ .Values.env.env | quote }}
