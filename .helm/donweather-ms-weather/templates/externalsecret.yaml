{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "donweather-ms-weather.fullname" . }}-secret
  labels:
    {{- include "donweather-ms-weather.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "donweather-ms-weather.fullname" . }}-secret
    creationPolicy: {{ .Values.externalSecret.target.creationPolicy | default "Owner" }}
    type: Opaque
  data:
    - secretKey: dsn
      remoteRef:
        key: {{ .Values.externalSecret.secrets.dsn.key }}
        {{- if .Values.externalSecret.secrets.dsn.property }}
        property: {{ .Values.externalSecret.secrets.dsn.property }}
        {{- end }}
    - secretKey: weather-api-key
      remoteRef:
        key: {{ .Values.externalSecret.secrets.weatherApiKey.key }}
        {{- if .Values.externalSecret.secrets.weatherApiKey.property }}
        property: {{ .Values.externalSecret.secrets.weatherApiKey.property }}
        {{- end }}
    - secretKey: cors-origin
      remoteRef:
        key: {{ .Values.externalSecret.secrets.corsOrigin.key }}
        {{- if .Values.externalSecret.secrets.corsOrigin.property }}
        property: {{ .Values.externalSecret.secrets.corsOrigin.property }}
        {{- end }}
{{- end }}
