{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "donweather-ms-weather.fullname" . }}-secret
  labels:
    {{- include "donweather-ms-weather.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "donweather-ms-weather.fullname" . }}-secret
    creationPolicy: {{ .Values.externalSecret.target.creationPolicy | default "Owner" }}
    template:
      type: Opaque
  data:
    - secretKey: db-password
      remoteRef:
        key: {{ .Values.externalSecret.secrets.dbPassword.key }}
        {{- if .Values.externalSecret.secrets.dbPassword.property }}
        property: {{ .Values.externalSecret.secrets.dbPassword.property }}
        {{- end }}
    - secretKey: db-user
      remoteRef:
        key: {{ .Values.externalSecret.secrets.dbUser.key }}
        {{- if .Values.externalSecret.secrets.dbUser.property }}
        property: {{ .Values.externalSecret.secrets.dbUser.property }}
        {{- end }}
    - secretKey: db-host
      remoteRef:
        key: {{ .Values.externalSecret.secrets.dbHost.key }}
        {{- if .Values.externalSecret.secrets.dbHost.property }}
        property: {{ .Values.externalSecret.secrets.dbHost.property }}
        {{- end }}
    - secretKey: db-port
      remoteRef:
        key: {{ .Values.externalSecret.secrets.dbPort.key }}
        {{- if .Values.externalSecret.secrets.dbPort.property }}
        property: {{ .Values.externalSecret.secrets.dbPort.property }}
        {{- end }}
    - secretKey: db-name
      remoteRef:
        key: {{ .Values.externalSecret.secrets.dbName.key }}
        {{- if .Values.externalSecret.secrets.dbName.property }}
        property: {{ .Values.externalSecret.secrets.dbName.property }}
        {{- end }}
    - secretKey: weather-api-key
      remoteRef:
        key: {{ .Values.externalSecret.secrets.weatherApiKey.key }}
        {{- if .Values.externalSecret.secrets.weatherApiKey.property }}
        property: {{ .Values.externalSecret.secrets.weatherApiKey.property }}
        {{- end }}
    - secretKey: cors-origin
      remoteRef:
        key: {{ .Values.externalSecret.secrets.corsOrigin.key }}
        {{- if .Values.externalSecret.secrets.corsOrigin.property }}
        property: {{ .Values.externalSecret.secrets.corsOrigin.property }}
        {{- end }}
{{- end }}
