{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "donweather-ms-weather.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "donweather-ms-weather.labels" . | nindent 4 }}
spec:
  parentRefs:
    - kind: Gateway
      name: {{ .Values.httpRoute.gatewayRef.name }}
      {{- if .Values.httpRoute.gatewayRef.namespace }}
      namespace: {{ .Values.httpRoute.gatewayRef.namespace }}
      {{- end }}
  {{- if .Values.httpRoute.hostnames }}
  hostnames:
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - matches:
        {{- range .matches }}
        - path:
            type: {{ .path.type }}
            value: {{ .path.value | quote }}
        {{- end }}
      backendRefs:
        {{- range .backendRefs }}
        - kind: Service
          name: {{ .name | default (include "donweather-ms-weather.fullname" $) }}
          port: {{ .port | default $.Values.service.port }}
        {{- end }}
    {{- end }}
{{- end }}
