{{- with .Values.httpRoute }}
{{- if .enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "donweather-ms-weather.fullname" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "donweather-ms-weather.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - kind: Gateway
      name: {{ .gatewayRef.name }}
      {{- if and .gatewayRef.namespace (ne .gatewayRef.namespace "") }}
      namespace: {{ .gatewayRef.namespace }}
      {{- end }}
  {{- if and .hostnames (gt (len .hostnames) 0) }}
  hostnames:
    {{- range .hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .rules }}
    - matches:
        {{- range .matches }}
        - path:
            type: {{ .path.type }}
            value: {{ .path.value | quote }}
        {{- end }}
      backendRefs:
        {{- range .backendRefs }}
        - kind: Service
          name: {{ if and .name (ne .name "") }}{{ .name }}{{ else }}{{ include "donweather-ms-weather.fullname" $ }}{{ end }}
          port: {{ .port | default $.Values.service.port }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
