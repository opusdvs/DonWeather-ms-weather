{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "donweather-ms-weather.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "donweather-ms-weather.labels" . | nindent 4 }}
spec:
  parentRefs:
    - kind: Gateway
      name: {{ .Values.httpRoute.gatewayRef.name }}
      {{- if and .Values.httpRoute.gatewayRef.namespace (ne .Values.httpRoute.gatewayRef.namespace "") }}
      namespace: {{ .Values.httpRoute.gatewayRef.namespace }}
      {{- end }}
  {{- if and .Values.httpRoute.hostnames (gt (len .Values.httpRoute.hostnames) 0) }}
  hostnames:
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - matches:
        {{- range .matches }}
        - path:
            type: {{ .path.type }}
            value: {{ .path.value | quote }}
        {{- end }}
      backendRefs:
        {{- range .backendRefs }}
        - kind: Service
          name: {{ if and .name (ne .name "") }}{{ .name }}{{ else }}{{ include "donweather-ms-weather.fullname" $ }}{{ end }}
          port: {{ .port | default $.Values.service.port }}
        {{- end }}
    {{- end }}
{{- end }}
