# Production values example
# Используйте этот файл для production окружения
# В ArgoCD укажите: helm.valueFiles: ["values.yaml", "values-production.yaml"]

replicaCount: 3

image:
  repository: your-registry/donweather-ms-weather
  pullPolicy: Always
  tag: "v1.0.0"

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  corsOrigin: "https://yourdomain.com"
  env: "production"

# В production используйте External Secrets или Sealed Secrets
# вместо хранения паролей в values.yaml
database:
  host: "postgres-service"
  port: 5432
  name: "weather"
  user: "myuser"
  password: "" # Установите через External Secrets
  sslmode: "require"

weatherApiKey: "" # Установите через External Secrets

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus
